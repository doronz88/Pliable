name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          UNIVERSAL=1 VERSION="$VERSION" ./build.sh
          ditto -c -k --keepParent build/Pliable.app "Pliable-$VERSION.zip"
          SHA=$(shasum -a 256 "Pliable-$VERSION.zip" | awk '{print $1}')
          echo "$SHA  Pliable-$VERSION.zip" > "Pliable-$VERSION.zip.sha256"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Pliable-$VERSION.zip" "Pliable-$VERSION.zip.sha256" \
            --title "Pliable $VERSION" --generate-notes

      # Needs a TAP_DEPLOY_KEY secret: private half of a deploy key with write access on doronz88/homebrew-tap.
      - name: Update Homebrew cask
        if: ${{ env.TAP_DEPLOY_KEY != '' }}
        run: |
          KEY="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:doronz88/homebrew-tap.git tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/pliable.rb
          if git diff --quiet; then echo "Cask already at ${VERSION}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pliable ${VERSION}"
          git push
          rm -f "$KEY"
