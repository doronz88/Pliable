name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          UNIVERSAL=1 VERSION="$VERSION" ./build.sh
          ditto -c -k --keepParent build/Pliable.app "Pliable-$VERSION.zip"
          SHA=$(shasum -a 256 "Pliable-$VERSION.zip" | awk '{print $1}')
          echo "$SHA  Pliable-$VERSION.zip" > "Pliable-$VERSION.zip.sha256"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Pliable-$VERSION.zip" "Pliable-$VERSION.zip.sha256" \
            --title "Pliable $VERSION" --generate-notes

      # Optional: needs a TAP_TOKEN secret with contents:write on doronz88/homebrew-tap.
      - name: Update Homebrew cask
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/doronz88/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/pliable.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pliable ${VERSION}"
          git push
